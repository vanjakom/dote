<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dote - humandot editor</title>
<!--
  dote is one file on purpose.

  It is meant to be opened from anywhere - a disk, github pages, or a plain
  file server that knows nothing about this project - and a server that gets
  content types wrong breaks a multi file page: Chrome refuses a stylesheet
  served as application/octet-stream in standards mode. Serving one .html is
  the least a server has to get right.

  Sections below, in order: style, markup, humandot (the file format),
  editor (the text pane), dotmap (the map pane), app (the wiring).

  Leaflet is the one thing still fetched, for the map. Its tiles need the
  network anyway, so inlining it would not make this work offline.
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/*
 * dote.css - menu bar on top, map and text side by side, status bar at the
 * bottom. The text pane is exactly 80 characters wide; the map takes the rest.
 *
 * The text is shown as plain text: one colour (black), one weight, no slant,
 * no underline, no line numbers. Nothing in the interface carries meaning
 * through the look of a glyph - states are shown with background tints
 * instead. That is also why there is a single light theme: black text needs a
 * light ground, so no dark variant is defined.
 */

:root {
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --font-size: 13px;
  --line-height: 1.5;
  --editor-columns: 80;
  --editor-padding: 10px;

  --text: #000000;

  --bg: #ffffff;
  --bg-sunken: #f2f2f2;
  --bg-raised: #ffffff;
  --border: #d6d6d6;
  --border-strong: #b0b0b0;

  --tint: rgba(0, 0, 0, 0.07);        /* hover */
  --tint-strong: rgba(0, 0, 0, 0.13); /* open menu, selection */

  /* markers are not text, they keep their colours */
  --dot-plain: #2563eb;
  --dot-public: #16a34a;
  --dot-personal: #d97706;
  --dot-invalid: #dc2626;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.4 var(--ui);
  font-weight: normal;
  overflow: hidden;
}

/* ------------------------------------------------------------- menu bar */

.menubar {
  display: flex;
  align-items: stretch;
  flex: 0 0 auto;
  height: 30px;
  padding: 0 6px;
  background: var(--bg-sunken);
  border-bottom: 1px solid var(--border);
  user-select: none;
}

.menubar__brand {
  display: flex;
  align-items: center;
  padding: 0 12px 0 6px;
  font-family: var(--mono);
  letter-spacing: 0.04em;
}

.menu { position: relative; }

.menu__title {
  height: 100%;
  padding: 0 10px;
  border: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  cursor: default;
}

.menu__title:hover,
.menu.is-open .menu__title { background: var(--tint-strong); }

.menu__items {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  z-index: 1000;
  min-width: 230px;
  padding: 4px;
  background: var(--bg-raised);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

.menu.is-open .menu__items { display: block; }

.menu__items button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  width: 100%;
  padding: 5px 10px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: default;
}

.menu__items button:hover { background: var(--tint); }

.menu__items hr {
  height: 0;
  margin: 4px 8px;
  border: 0;
  border-top: 1px solid var(--border);
}

.menu__hint {
  font-family: var(--mono);
  font-size: 11px;
}

/* ------------------------------------------------------------ workspace */

.workspace {
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
}

.pane { position: relative; min-height: 0; }

.pane--map {
  flex: 1 1 auto;
  min-width: 0;
}

.pane--editor {
  flex: 0 0 auto;
  border-left: 1px solid var(--border);
}

.pane--editor.is-hidden { display: none; }

#map {
  width: 100%;
  height: 100%;
  background: var(--bg-sunken);
}

/* --------------------------------------------------------------- editor */

/*
 * A bare textarea. Its own font declaration is what makes 1ch a character of
 * the monospace face, so the 80 column width below measures what it says.
 */
#text {
  display: block;
  width: calc(var(--editor-columns) * 1ch + var(--editor-padding) * 2);
  height: 100%;
  margin: 0;
  padding: var(--editor-padding);
  border: 0;
  background: var(--bg);
  color: var(--text);
  font: var(--font-size) / var(--line-height) var(--mono);
  white-space: pre;
  tab-size: 4;
  overflow: auto;
  resize: none;
  outline: 0;
}

#text::selection { background: var(--tint-strong); }

/* --------------------------------------------------------------- markers */

.dot-marker {
  width: 14px;
  height: 14px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--dot-plain);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
}

.dot-marker--public { background: var(--dot-public); }
.dot-marker--personal { background: var(--dot-personal); }
.dot-marker--invalid { background: var(--dot-invalid); }

.dot-marker--selected {
  box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.55), 0 1px 4px rgba(0, 0, 0, 0.45);
  transform: scale(1.35);
}

.map--armed,
.map--armed .leaflet-grab { cursor: crosshair; }

.map-control__button {
  font-size: 18px;
  line-height: 26px;
}

.map-control__button.is-active {
  background: var(--tint-strong);
  color: var(--text);
}

.leaflet-container { font: 12px var(--ui); }
.leaflet-container a { color: var(--text); }

/* ------------------------------------------------------------ status bar */

.statusbar {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 0 0 auto;
  height: 24px;
  padding: 0 10px;
  background: var(--bg-sunken);
  border-top: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  user-select: none;
}

.status { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.status__spacer { flex: 1 1 auto; }
.status--file.is-modified::after { content: " *"; }
.status--problems:empty { display: none; }
.status--coordinate { cursor: copy; }

/* ---------------------------------------------------------------- sheet */

.sheet {
  width: min(720px, 90vw);
  max-height: 80vh;
  padding: 0;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: var(--bg-raised);
  color: var(--text);
}

.sheet::backdrop { background: rgba(0, 0, 0, 0.35); }

.sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.sheet__title {
  margin: 0;
  font-size: 14px;
  font-weight: normal;
}

.sheet__close {
  border: 0;
  background: transparent;
  color: var(--text);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}

.sheet__body {
  max-height: calc(80vh - 50px);
  padding: 16px;
  overflow: auto;
  font-size: 13px;
  line-height: 1.6;
}

.sheet__body h3 {
  margin: 18px 0 6px;
  font-size: 12px;
  font-weight: normal;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.sheet__body h3:first-child { margin-top: 0; }

.sheet__body pre {
  margin: 0;
  padding: 10px 12px;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 12px;
  overflow-x: auto;
}

.sheet__body code {
  font-family: var(--mono);
  font-size: 12px;
}

.sheet__body table { width: 100%; border-collapse: collapse; }
.sheet__body td { padding: 3px 0; vertical-align: top; }
.sheet__body td:first-child {
  width: 190px;
  padding-right: 16px;
  font-family: var(--mono);
  white-space: nowrap;
}
</style>
</head>
<body>

<div class="menubar" id="menubar">
  <span class="menubar__brand">dote</span>

  <div class="menu" data-menu>
    <button class="menu__title" type="button">File</button>
    <div class="menu__items">
      <button type="button" data-action="file-new">New</button>
      <button type="button" data-action="file-open">Open&hellip;<span class="menu__hint" data-shortcut="O"></span></button>
      <hr>
      <button type="button" data-action="file-save">Save<span class="menu__hint" data-shortcut="S"></span></button>
      <button type="button" data-action="file-save-as">Save as&hellip;</button>
    </div>
  </div>

  <div class="menu" data-menu>
    <button class="menu__title" type="button">Edit</button>
    <div class="menu__items">
      <button type="button" data-action="edit-format">Format document<span class="menu__hint" data-shortcut="&#8679;F"></span></button>
      <hr>
      <button type="button" data-action="edit-add-here">Add dot at map center</button>
      <button type="button" data-action="edit-add-click">Add dot by clicking the map</button>
      <button type="button" data-action="edit-delete">Delete dot at cursor</button>
    </div>
  </div>

  <div class="menu" data-menu>
    <button class="menu__title" type="button">View</button>
    <div class="menu__items">
      <button type="button" data-action="view-fit">Fit map to all dots</button>
      <button type="button" data-action="view-zoom">Zoom to dot at cursor<span class="menu__hint" data-shortcut="G"></span></button>
      <hr>
      <button type="button" data-action="view-toggle-editor">Hide the text pane</button>
    </div>
  </div>

  <div class="menu" data-menu>
    <button class="menu__title" type="button">Help</button>
    <div class="menu__items">
      <button type="button" data-action="help-format">The humandot format</button>
      <button type="button" data-action="help-keys">Keyboard shortcuts</button>
      <button type="button" data-action="help-url">Opening from a url</button>
    </div>
  </div>
</div>

<main class="workspace" id="workspace">
  <div class="pane pane--map">
    <div id="map"></div>
  </div>

  <div class="pane pane--editor" id="editor-pane">
    <textarea id="text"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              aria-label="humandot source"></textarea>
  </div>
</main>

<div class="statusbar" id="statusbar">
  <span class="status status--file" id="status-file">untitled.dot</span>
  <span class="status" id="status-dots">0 dots</span>
  <span class="status status--problems" id="status-problems"></span>
  <span class="status status--message" id="status-message"></span>
  <span class="status__spacer"></span>
  <span class="status" id="status-dot"></span>
  <span class="status" id="status-cursor">Ln 1, Col 1</span>
  <span class="status status--coordinate" id="status-coordinate" title="longitude, latitude - click to copy"></span>
</div>

<dialog class="sheet" id="sheet">
  <div class="sheet__head">
    <h2 class="sheet__title" id="sheet-title"></h2>
    <button class="sheet__close" type="button" data-action="sheet-close" aria-label="Close">&times;</button>
  </div>
  <div class="sheet__body" id="sheet-body"></div>
</dialog>

<input type="file" id="file-input" accept=".dot,text/plain" hidden>

<!--
  Leaflet is loaded before the code below and without defer, so that L exists
  by the time any of it runs. An inline script is never deferred, so an
  external one placed after these would arrive too late.
-->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/*
 * humandot.js - parser, writer and formatter for the humandot file format.
 *
 * Pure logic, no DOM. Mirrors clj-geo:
 *   src/cljc/clj_geo/dot/core.clj
 *   src/clj/clj_geo/dot/store/humandot.clj
 *
 * Format recap:
 *   [humandot]            magic first line
 *   [statement]           directive, [tag:xxx] appends xxx to every dot
 *   ; comment             comment line (column 0)
 *   longitude, latitude   starts a dot   <- longitude FIRST
 *       tag               indented line, belongs to the dot above
 *   <blank>               closes the dot
 *
 * Tag conventions: "#x" public label, "@x" personal label, "|key|value"
 * key/value pair, "---" separates extracted from added tags, "===" separates
 * public from private tags.
 */
(function (global) {
  'use strict';

  var MAGIC = '[humandot]';
  var TAG_INDENT = '   ';

  /* ---------------------------------------------------------------- utils */

  function splitLines(text) {
    // normalize CRLF/CR so exact line comparisons (like [humandot]) hold
    return String(text == null ? '' : text).split(/\r\n|\r|\n/);
  }

  function isBlank(line) {
    return line.trim().length === 0;
  }

  function startsWith(s, prefix) {
    return s.lastIndexOf(prefix, 0) === 0;
  }

  // strict number parse: "44abc" is not a coordinate
  function toNumber(s) {
    if (s == null) return null;
    var t = s.trim();
    if (t === '') return null;
    var v = Number(t);
    return isFinite(v) ? v : null;
  }

  // coordinate as text: no exponent notation, no trailing zeros
  function formatNumber(v) {
    if (v == null || !isFinite(v)) return '';
    var s = v.toFixed(7);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s === '-0' ? '0' : s;
  }

  /* --------------------------------------------------------------- parsing */

  var LINE = {
    COMMENT: 'comment',
    MAGIC: 'magic',
    STATEMENT: 'statement',
    BLANK: 'blank',
    TAG: 'tag',
    COORDINATE: 'coordinate',
    UNKNOWN: 'unknown'
  };

  /*
   * Classify a single line. Branch order is significant and matches the
   * Clojure reader: comment, magic, statement, blank, tag, coordinate.
   * An indented ";" is a tag, not a comment; an indented "[x]" is a tag too.
   */
  function classifyLine(line) {
    if (startsWith(line, ';')) return LINE.COMMENT;
    if (line === MAGIC) return LINE.MAGIC;
    if (line.length >= 2 && startsWith(line, '[') && line.charAt(line.length - 1) === ']') {
      return LINE.STATEMENT;
    }
    if (isBlank(line)) return LINE.BLANK;
    if (startsWith(line, ' ') || startsWith(line, '\t')) return LINE.TAG;
    if (line.indexOf(',') >= 0) return LINE.COORDINATE;
    return LINE.UNKNOWN;
  }

  function parseCoordinate(line) {
    var fields = line.split(',');
    return {
      longitude: toNumber(fields[0]),
      latitude: toNumber(fields[1]),
      extra: fields.length > 2
    };
  }

  /*
   * parse(text) -> {
   *   dots: [dot], defaultTags: [string], statements: [{line, statement}],
   *   problems: [{line, severity, message}], lineCount
   * }
   *
   * dot = {
   *   longitude, latitude,     numbers, null when unparsable
   *   tags,                    tags written in the file, in order
   *   allTags,                 tags + defaultTags (what clj-geo hands out)
   *   line,                    0-based index of the coordinate line
   *   endLine,                 0-based index of the dot's last line
   *   tagLines,                0-based index per entry in tags
   *   valid                    coordinates parsed and in range
   * }
   *
   * Divergence from clj-geo (deliberate, see AGENTS.md): a coordinate line
   * that follows another dot without a blank line between them closes the
   * previous dot instead of discarding it. Files that are well formed parse
   * identically; malformed ones keep their data instead of losing it.
   */
  function parse(text) {
    var lines = splitLines(text);
    var dots = [];
    var statements = [];
    var problems = [];
    var defaultTags = [];
    var current = null;

    function problem(line, severity, message) {
      problems.push({ line: line, severity: severity, message: message });
    }

    function closeCurrent(endLine) {
      if (!current) return;
      current.endLine = Math.max(current.line, endLine);
      dots.push(current);
      current = null;
    }

    if (lines.length === 0 || lines[0] !== MAGIC) {
      problem(0, 'warning', 'file should start with ' + MAGIC);
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      switch (classifyLine(line)) {
        case LINE.COMMENT:
        case LINE.MAGIC:
          break;

        case LINE.STATEMENT:
          var statement = line.substring(1, line.length - 1);
          statements.push({ line: i, statement: statement });
          if (startsWith(statement, 'tag:')) {
            defaultTags.push(statement.substring(4));
          }
          break;

        case LINE.BLANK:
          closeCurrent(i - 1);
          break;

        case LINE.TAG:
          if (!current) {
            problem(i, 'error', 'indented tag before any location');
            break;
          }
          current.tags.push(line.trim());
          current.tagLines.push(i);
          break;

        case LINE.COORDINATE:
          closeCurrent(i - 1);
          var coordinate = parseCoordinate(line);
          current = {
            longitude: coordinate.longitude,
            latitude: coordinate.latitude,
            tags: [],
            allTags: [],
            line: i,
            endLine: i,
            tagLines: [],
            valid: false
          };
          if (coordinate.longitude == null || coordinate.latitude == null) {
            problem(i, 'error', 'cannot read "longitude, latitude" from this line');
          } else if (Math.abs(coordinate.longitude) > 180 || Math.abs(coordinate.latitude) > 90) {
            var swapped = Math.abs(coordinate.longitude) <= 90 &&
              Math.abs(coordinate.latitude) > 90 && Math.abs(coordinate.latitude) <= 180;
            problem(i, 'error', swapped
              ? 'coordinates out of range - the order is longitude, latitude'
              : 'coordinates out of range');
          } else {
            current.valid = true;
          }
          if (coordinate.extra) {
            problem(i, 'warning', 'only the first two comma separated fields are read');
          }
          break;

        default:
          problem(i, 'warning', 'line is ignored, it is neither a comment, a tag nor a location');
          break;
      }
    }
    closeCurrent(lines.length - 1);

    // default tags from [tag:x] directives are appended to every dot
    dots.forEach(function (dot) {
      dot.allTags = dot.tags.concat(defaultTags);
    });

    return {
      dots: dots,
      defaultTags: defaultTags,
      statements: statements,
      problems: problems,
      lineCount: lines.length
    };
  }

  /* ----------------------------------------------------------------- tags */

  var TAG = {
    PUBLIC: 'public',       // #label
    PERSONAL: 'personal',   // @label
    PAIR: 'pair',           // |key|value
    LINK: 'link',           // http(s)://...
    SEPARATOR: 'separator', // --- or ===
    NOTE: 'note'            // anything else, free text
  };

  function classifyTag(tag) {
    var t = tag.trim();
    if (t === '---' || t === '===') return TAG.SEPARATOR;
    if (startsWith(t, '#')) return TAG.PUBLIC;
    if (startsWith(t, '@')) return TAG.PERSONAL;
    if (startsWith(t, '|')) return TAG.PAIR;
    if (startsWith(t, 'http://') || startsWith(t, 'https://')) return TAG.LINK;
    return TAG.NOTE;
  }

  /*
   * Links inside a line. A tag is often nothing but a URL, but one can also
   * sit in the middle of a note or a comment, so the whole line is scanned.
   * Trailing sentence punctuation is left out of the match.
   */
  var LINK_PATTERN = /https?:\/\/[^\s]+/g;

  function linkAt(line, column) {
    LINK_PATTERN.lastIndex = 0;
    var match;
    while ((match = LINK_PATTERN.exec(line)) !== null) {
      var url = match[0].replace(/[.,;:!?]+$/, '');
      var start = match.index;
      var end = start + url.length;
      if (column >= start && column < end) {
        return { url: url, start: start, end: end };
      }
    }
    return null;
  }

  // "|key|value" -> {key: "key", value: "value"}, null when not a pair
  function parsePair(tag) {
    var t = tag.trim();
    if (!startsWith(t, '|')) return null;
    var rest = t.substring(1);
    var index = rest.indexOf('|');
    if (index < 0) return null;
    return { key: rest.substring(0, index), value: rest.substring(index + 1) };
  }

  // first note-like tag, used as the display name of a dot
  function label(dot) {
    var tags = dot.allTags && dot.allTags.length ? dot.allTags : dot.tags;
    for (var i = 0; i < tags.length; i++) {
      var kind = classifyTag(tags[i]);
      if (kind === TAG.NOTE) return tags[i];
    }
    for (var j = 0; j < tags.length; j++) {
      var k = classifyTag(tags[j]);
      if (k === TAG.PUBLIC || k === TAG.PERSONAL) return tags[j];
    }
    return null;
  }

  /* --------------------------------------------------------------- writing */

  // canonical text of one dot, matching clj-geo write-to-string
  function dotToString(dot) {
    var text = formatNumber(dot.longitude) + ', ' + formatNumber(dot.latitude) + '\n';
    (dot.tags || []).forEach(function (tag) {
      text += TAG_INDENT + tag + '\n';
    });
    return text;
  }

  // whole file from a list of dots, with optional header comment lines
  function write(dots, headerLines) {
    var text = MAGIC + '\n\n';
    (headerLines || []).forEach(function (line) {
      text += '; ' + line + '\n';
    });
    if (headerLines && headerLines.length) text += '\n';
    (dots || []).forEach(function (dot) {
      text += dotToString(dot) + '\n';
    });
    return text;
  }

  /*
   * format(text) normalizes a document in place: it rewrites coordinate and
   * tag lines to canonical spacing and collapses blank runs, but keeps
   * comments, directives and unknown lines where the author put them.
   * A comment directly above a dot stays attached to it.
   */
  function format(text) {
    var lines = splitLines(text);
    var out = [];
    var dotOpen = false;

    function emitBlank() {
      if (out.length === 0) return;                          // no leading blank
      if (isBlank(out[out.length - 1])) return;              // collapse runs
      out.push('');
    }

    lines.forEach(function (line) {
      var kind = classifyLine(line);
      switch (kind) {
        case LINE.BLANK:
          emitBlank();
          dotOpen = false;
          break;

        case LINE.MAGIC:
          out.push(MAGIC);
          break;

        case LINE.COORDINATE:
          // a dot must be closed by a blank line before the next one starts,
          // otherwise clj-geo drops it
          if (dotOpen) emitBlank();
          var coordinate = parseCoordinate(line);
          out.push(coordinate.longitude == null || coordinate.latitude == null
            ? line.replace(/\s+$/, '')
            : formatNumber(coordinate.longitude) + ', ' + formatNumber(coordinate.latitude));
          dotOpen = true;
          break;

        case LINE.TAG:
          out.push(TAG_INDENT + line.trim());
          break;

        default:
          // comments and directives keep their place, also between dots
          out.push(line.replace(/\s+$/, ''));
          break;
      }
    });

    // guarantee the magic line, then exactly one trailing newline
    if (out.length === 0 || out[0] !== MAGIC) out = [MAGIC, ''].concat(out);

    withoutPan(function () {
      editor.selectLines(dot.line, dot.endLine);
      editor.textarea.focus();
    });
  }

  function dotAtCursor() {
    var index = humandot.dotIndexAtLine(state.parsed.dots, editor.cursor().line);
    return index < 0 ? null : state.parsed.dots[index];
  }

  /* ----------------------------------------------------------- dot editing */

  /*
   * Where a new dot goes: immediately above the first existing one, so the
   * newest is always at the top of the file. Comments written directly above
   * that first dot belong to it and are stepped over. Returns -1 when the
   * file holds no dots yet and the block should simply go at the end, after
   * the header.
   */
  function newDotLine() {
    var lines = humandot.splitLines(editor.getValue());
    var first = -1;
    for (var i = 0; i < lines.length && first < 0; i++) {
      if (humandot.classifyLine(lines[i]) === humandot.LINE.COORDINATE) first = i;
    }
    if (first < 0) return -1;
    while (first > 0 && humandot.classifyLine(lines[first - 1]) === humandot.LINE.COMMENT) {
      first -= 1;
    }
    return first;
  }

  function addDot(longitude, latitude) {
    var block = coordinateText(longitude, latitude) + '\n' + humandot.TAG_INDENT;
    var line = newDotLine();

    withoutPan(function () {
      if (line < 0) {
        editor.appendBlock(block);
      } else {
        var start = editor.lineRange(line).start;
        // the blank line after the indent keeps this dot separate from the
        // one that used to be first
        editor.replaceRange(start, start, block + '\n\n');
        editor.moveCursorTo(line + 1, humandot.TAG_INDENT.length);
      }
      reparse();
    });

    dotMap.revealDot(0);
    flash('dot added - type a name');
  }

  function moveDot(index, longitude, latitude) {
    var dot = state.parsed.dots[index];
    if (!dot) return;
    withoutPan(function () {
      editor.replaceLine(dot.line, coordinateText(longitude, latitude));
      reparse();
    });
    flash('moved to ' + coordinateText(longitude, latitude));
  }

  function deleteDotAtCursor() {
    var dot = dotAtCursor();
    if (!dot) {
      flash('put the cursor inside a dot first');
      return;
    }
    var lines = humandot.splitLines(editor.getValue());
    var last = dot.endLine;
    if (last + 1 < lines.length && lines[last + 1].trim() === '') last += 1;
    editor.removeLines(dot.line, last);
    reparse();
    flash('dot deleted');
  }

  function formatDocument() {
    // the whole document is replaced, so the cursor passes through the end of
    // the text on the way back - not a reason to move the map
    withoutPan(function () {
      var cursor = editor.cursor();
      editor.replaceRange(0, editor.getValue().length, humandot.format(editor.getValue()));
      reparse();
      editor.moveCursorTo(Math.min(cursor.line, editor.lineCount() - 1), 0);
    });
    flash('document formatted');
  }

  /* ----------------------------------------------------------- parameters */

  /*
   *   ?url=<url>          fetch the document from there on start
   *   ?writable=true      Save posts the document back to that same url
   *
   * The url is taken literally, with one rewrite: the two github.com
   * addresses you actually have in hand when browsing a repository, the blob
   * page and the "Raw" link, both point at raw.githubusercontent.com content
   * without being fetchable themselves.
   *
   *   .../blob/...   serves html, and no CORS header at all
   *   .../raw/...    a 302 to the raw host, carrying an *empty*
   *                  Access-Control-Allow-Origin. an empty value matches no
   *                  origin, so the browser rejects the redirect and never
   *                  follows it to the file, which does allow the read
   *
   * Neither pattern can be a POST target, so the rewrite cannot collide with
   * a writable endpoint.
   */
  var GITHUB_PAGE = /^https:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/(.+)$/;

  function fetchableUrl(url) {
    var match = GITHUB_PAGE.exec(url);
    return match
      ? 'https://raw.githubusercontent.com/' + match[1] + '/' + match[2] + '/' + match[3]
      : url;
  }

  function fileNameFor(url) {
    try {
      var path = new URL(url, global.location.href).pathname;
      return path.substring(path.lastIndexOf('/') + 1) || 'untitled.dot';
    } catch (error) {
      return 'untitled.dot';
    }
  }

  function readParameters() {
    var parameters = new URLSearchParams(global.location.search);
    var url = parameters.get('url');
    var writable = parameters.get('writable');
    return {
      url: url ? fetchableUrl(url.trim()) : null,
      writable: writable === 'true' || writable === '1'
    };
  }

  async function loadFromUrl(url, keepView) {
    flash('loading ' + url);
    try {
      var response = await fetch(url, { headers: { Accept: 'text/plain' } });
      if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
      var text = await response.text();
      setDocument(text, fileNameFor(url), null, keepView);
      state.sourceUrl = url;   // setDocument cleared it, this is where it came from
      updateStatus();
      flash('loaded ' + url);
    } catch (error) {
      // a failure here is almost always the endpoint not allowing the origin
      flash('could not load ' + url + ': ' + error.message);
    }
  }

  /* ---------------------------------------------------------------- files */

  var FILE_TYPES = [{
    description: 'humandot file',
    accept: { 'text/plain': ['.dot'] }
  }];

  /*
   * Saving over the file you opened needs the File System Access API. It is
   * missing in two situations and the difference matters to whoever is
   * looking at the status bar:
   *
   *   - the page was opened from disk. A file:// page has an opaque origin
   *     ("null"), and the pickers are gated on a secure context with a real
   *     one, so Chrome does not expose them. Serving the directory fixes it,
   *     localhost counts as secure.
   *   - the browser has not implemented them (Firefox, Safari). Nothing to
   *     be done there, every save is a download.
   *
   * Either way Save degrades to a download, which is fine as long as it says
   * so instead of quietly dropping a second copy in ~/Downloads.
   */
  var canSaveInPlace = typeof global.showSaveFilePicker === 'function';
  var servedFromDisk = global.location.protocol === 'file:';

  function noPickerReason() {
    return servedFromDisk
      ? 'saving in place needs the page served, not opened from disk'
      : 'this browser cannot save in place';
  }

  async function openFile() {
    if (global.showOpenFilePicker) {
      try {
        var handles = await global.showOpenFilePicker({ types: FILE_TYPES });
        var handle = handles[0];
        var file = await handle.getFile();
        setDocument(await file.text(), file.name, handle);
        flash('opened ' + file.name);
      } catch (error) {
        if (error && error.name !== 'AbortError') flash('could not open: ' + error.message);
      }
      return;
    }
    elements.fileInput.click();
  }

  /*
   * writable=true is a promise by whoever wrote the link that the url which
   * served the document also takes it back. The body goes as text/plain,
   * which keeps this a CORS simple request - there is no preflight for the
   * endpoint to answer, it only has to allow the origin on the response.
   */
  async function postToSource() {
    try {
      var response = await fetch(state.sourceUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: editor.getValue()
      });
      if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
      markSaved();
      flash('saved to ' + state.sourceUrl);
    } catch (error) {
      flash('could not save to ' + state.sourceUrl + ': ' + error.message);
    }
  }

  async function saveFile() {
    if (state.writable && state.sourceUrl) {
      await postToSource();
      return;
    }
    if (!state.fileHandle) {
      await saveFileAs();
      return;
    }
    try {
      var writable = await state.fileHandle.createWritable();
      await writable.write(editor.getValue());
      await writable.close();
      markSaved();
      flash('saved ' + state.fileName);
    } catch (error) {
      flash('could not save: ' + error.message);
    }
  }

  async function saveFileAs() {
    if (canSaveInPlace) {
      try {
        var handle = await global.showSaveFilePicker({
          suggestedName: state.fileName,
          types: FILE_TYPES
        });
        state.fileHandle = handle;
        state.fileName = handle.name;
        await saveFile();
      } catch (error) {
        if (error && error.name !== 'AbortError') flash('could not save: ' + error.message);
      }
      return;
    }
    downloadFile();
  }

  function downloadFile() {
    var blob = new Blob([editor.getValue()], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = state.fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    global.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    markSaved();
    flash(canSaveInPlace
      ? 'downloaded ' + state.fileName
      : 'downloaded ' + state.fileName + ' - ' + noPickerReason());
  }

  /* ------------------------------------------------------------ url hash */

  /*
   * The map view lives in the location hash as #map=zoom/latitude/longitude.
   *
   * That is latitude first, the one place in this project where longitude does
   * not come first - it is the hash format openstreetmap.org, geojson.io and
   * umap all use, so a view can be pasted straight from one to the other. The
   * rest of the app stays longitude first.
   */
  var HASH_PATTERN = /^#map=(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/;
  var hashIsOurs = false;      // the hash change we are about to hear is our own
  var canReplaceState = true;  // file:// forbids replaceState in some browsers

  function readHash() {
    var match = HASH_PATTERN.exec(global.location.hash);
    if (!match) return null;
    var view = {
      zoom: Number(match[1]),
      latitude: Number(match[2]),
      longitude: Number(match[3])
    };
    if (view.zoom < 0 || view.zoom > 22) return null;
    if (Math.abs(view.latitude) > 90 || Math.abs(view.longitude) > 180) return null;
    return view;
  }

  function hashFor(view) {
    return '#map=' + round(view.zoom, 2) + '/' +
      round(view.latitude, HASH_PRECISION).toFixed(HASH_PRECISION) + '/' +
      round(view.longitude, HASH_PRECISION).toFixed(HASH_PRECISION);
  }

  function writeHash() {
    var hash = hashFor(dotMap.center());
    if (hash === global.location.hash) return;
    if (canReplaceState) {
      try {
        // replaceState does not fire hashchange, so nothing to guard against
        global.history.replaceState(null, '',
          global.location.pathname + global.location.search + hash);
        return;
      } catch (error) {
        // opened from disk: fall back to assigning the hash, which costs a
        // history entry but is all the browser allows there
        canReplaceState = false;
      }
    }
    hashIsOurs = true;
    global.location.hash = hash;
  }

  function applyHash() {
    if (hashIsOurs) {
      hashIsOurs = false;
      return;
    }
    var view = readHash();
    if (view) dotMap.setView(view);
  }

  /* ----------------------------------------------------------- status bar */

  function updateStatus(cursor) {
    cursor = cursor || editor.cursor();

    elements.file.textContent = state.fileName;
    elements.file.classList.toggle('is-modified', isModified());
    elements.file.title = state.sourceUrl
      ? state.sourceUrl + (state.writable ? ' (Save posts back here)' : ' (read only)')
      : state.fileName;

    var dots = state.parsed.dots;
    var defaults = state.parsed.defaultTags.length;
    elements.dots.textContent = dots.length + (dots.length === 1 ? ' dot' : ' dots') +
      (defaults ? ' (+' + defaults + ' default tag' + (defaults === 1 ? '' : 's') + ')' : '');

    // without line numbers in the pane, the status bar is where a problem gets
    // located - report the count and spell out the first one of that severity
    var all = state.parsed.problems;
    var errors = all.filter(function (p) { return p.severity === 'error'; });
    var worst = errors.length ? errors : all;
    var noun = errors.length ? 'error' : 'warning';
    elements.problems.textContent = worst.length
      ? worst.length + ' ' + noun + (worst.length === 1 ? '' : 's') +
        ', line ' + (worst[0].line + 1) + ': ' + worst[0].message
      : '';

    elements.cursor.textContent = 'Ln ' + (cursor.line + 1) + ', Col ' + (cursor.column + 1);

    if (state.selected >= 0) {
      var dot = dots[state.selected];
      var label = humandot.label(dot);
      elements.dot.textContent = 'dot ' + (state.selected + 1) + '/' + dots.length +
        (label ? ' - ' + label : '');
    } else {
      elements.dot.textContent = '';
    }
  }

  function showCoordinate(pointer) {
    var view = pointer || dotMap.center();
    elements.coordinate.textContent = coordinateText(view.longitude, view.latitude) +
      (pointer ? '' : '  z' + dotMap.center().zoom);
  }

  /* ----------------------------------------------------------------- menu */

  function closeMenus() {
    document.querySelectorAll('.menu.is-open').forEach(function (menu) {
      menu.classList.remove('is-open');
    });
  }

  function setUpMenus() {
    var menus = Array.prototype.slice.call(document.querySelectorAll('[data-menu]'));

    menus.forEach(function (menu) {
      var title = menu.querySelector('.menu__title');
      title.addEventListener('click', function (event) {
        event.stopPropagation();
        var open = menu.classList.contains('is-open');
        closeMenus();
        if (!open) menu.classList.add('is-open');
      });
      // once a menu is open, hovering the neighbours switches between them
      title.addEventListener('mouseenter', function () {
        if (document.querySelector('.menu.is-open')) {
          closeMenus();
          menu.classList.add('is-open');
        }
      });
    });

    document.addEventListener('click', function (event) {
      var button = event.target.closest('[data-action]');
      if (button) {
        closeMenus();
        runAction(button.getAttribute('data-action'));
        return;
      }
      if (!event.target.closest('[data-menu]')) closeMenus();
    });

    // render shortcut hints for this platform
    document.querySelectorAll('[data-shortcut]').forEach(function (hint) {
      var key = hint.getAttribute('data-shortcut');
      hint.textContent = isApple ? '⌘' + key : 'Ctrl+' + key;
    });
  }

  /* -------------------------------------------------------------- actions */

  function runAction(action) {
    switch (action) {
      case 'file-new':
        if (isModified() && !global.confirm('Discard unsaved changes?')) return;
        setDocument(TEMPLATE, 'untitled.dot', null);
        break;
      case 'file-open': openFile(); break;
      case 'file-save': saveFile(); break;
      case 'file-save-as': saveFileAs(); break;

      case 'edit-format': formatDocument(); break;
      case 'edit-add-here':
        var center = dotMap.center();
        addDot(center.longitude, center.latitude);
        break;
      case 'edit-add-click':
        dotMap.setArmed(true);
        flash('click the map to place a dot, Esc cancels');
        break;
      case 'edit-delete': deleteDotAtCursor(); break;

      case 'view-fit':
        if (!dotMap.fitToDots()) flash('no dots with valid coordinates');
        break;
      case 'view-zoom':
        if (state.selected < 0) flash('put the cursor inside a dot first');
        else dotMap.panToDot(state.selected, 15);
        break;
      case 'view-toggle-editor': toggleEditorPane(); break;

      case 'help-format': showSheet('The humandot format', FORMAT_HELP); break;
      case 'help-keys': showSheet('Keyboard shortcuts', keyboardHelp()); break;
      case 'help-url': showSheet('Opening from a url', URL_HELP); break;

      case 'sheet-close': elements.sheet.close(); break;
    }
  }

  function toggleEditorPane() {
    var hidden = elements.editorPane.classList.toggle('is-hidden');
    var toggle = document.querySelector('[data-action="view-toggle-editor"]');
    if (toggle) toggle.textContent = hidden ? 'Show the text pane' : 'Hide the text pane';
    dotMap.invalidateSize();
  }

  /* ----------------------------------------------------------------- help */

  var FORMAT_HELP = [
    '<h3>Shape of a file</h3>',
    '<pre>[humandot]\n',
    '; tags used\n;    #camp - a place to sleep\n\n',
    '[tag:#trip2026]\n\n',
    '20.4612, 44.8125\n   Beograd\n   #capital\n   |population|1370000\n',
    '   https://www.openstreetmap.org/relation/1677007\n\n',
    '19.8335, 45.2671\n   Novi Sad\n   @visited\n</pre>',
    '<h3>Lines</h3>',
    '<table>',
    '<tr><td>[humandot]</td><td>first line of every file</td></tr>',
    '<tr><td>[tag:#x]</td><td>directive, appends #x to every dot in the file</td></tr>',
    '<tr><td>; text</td><td>comment, ignored by readers</td></tr>',
    '<tr><td>longitude, latitude</td><td>starts a dot - longitude comes first</td></tr>',
    '<tr><td>&nbsp;&nbsp;&nbsp;tag</td><td>indented line, belongs to the dot above</td></tr>',
    '<tr><td>(blank line)</td><td>closes the dot</td></tr>',
    '</table>',
    '<h3>Tags</h3>',
    '<table>',
    '<tr><td>#label</td><td>public label</td></tr>',
    '<tr><td>@label</td><td>personal label</td></tr>',
    '<tr><td>|key|value</td><td>key and value pair</td></tr>',
    '<tr><td>https://&hellip;</td><td>reference, OpenStreetMap links preferred</td></tr>',
    '<tr><td>---</td><td>separates extracted tags from added ones</td></tr>',
    '<tr><td>===</td><td>separates public tags from private ones</td></tr>',
    '<tr><td>anything else</td><td>free text, the first one names the dot</td></tr>',
    '</table>'
  ].join('');

  var URL_HELP = [
    '<h3>Parameters</h3>',
    '<table>',
    '<tr><td>?url=&hellip;</td><td>fetch the document from there when dote starts, ',
    'instead of opening an empty one</td></tr>',
    '<tr><td>?writable=true</td><td>Save posts the document back to that same url</td></tr>',
    '</table>',
    '<h3>Example</h3>',
    '<pre>index.html?url=https://raw.githubusercontent.com/you/dots/master/camps.dot</pre>',
    '<h3>What the other end has to do</h3>',
    '<table>',
    '<tr><td>reading</td><td>answer the GET with the file and an ',
    '<code>Access-Control-Allow-Origin</code> header. raw.githubusercontent.com ',
    'already does; a github.com &hellip;/blob/&hellip; address is rewritten to its raw ',
    'form for you</td></tr>',
    '<tr><td>writing</td><td>accept a POST whose body is the whole file as ',
    '<code>text/plain</code>, and allow the origin on the response. Sending it as ',
    'text/plain keeps it a simple request, so there is no preflight to answer</td></tr>',
    '</table>',
    '<h3>Notes</h3>',
    '<table>',
    '<tr><td>the map view</td><td>the <code>#map=</code> hash still applies, so one link ',
    'can carry both the file and where to look</td></tr>',
    '<tr><td>without writable</td><td>the document is read only; Save falls back to ',
    'writing a local copy</td></tr>',
    '</table>'
  ].join('');

  function keyboardHelp() {
    var modifier = isApple ? '⌘' : 'Ctrl+';
    var rows = [
      [modifier + 'O', 'open a file'],
      [modifier + 'S', 'save'],
      [modifier + '⇧F', 'format the document'],
      [modifier + 'G', 'zoom the map to the dot at the cursor'],
      ['Enter', 'in a dot, start the next tag already indented'],
      ['⇧Enter', 'a plain newline, no indent'],
      ['Tab', 'insert the tag indent'],
      ['click a link', 'open it in a new tab'],
      [(isApple ? '⌥' : 'Alt') + ' click a link', 'place the caret in it instead'],
      ['Esc', 'close a menu, cancel adding a dot'],
      ['click a marker', 'select that dot in the text'],
      ['drag a marker', 'rewrite its coordinate line']
    ];
    return '<table>' + rows.map(function (row) {
      return '<tr><td>' + row[0] + '</td><td>' + row[1] + '</td></tr>';
    }).join('') + '</table>';
  }

  function showSheet(title, html) {
    elements.sheetTitle.textContent = title;
    elements.sheetBody.innerHTML = html;
    elements.sheet.showModal();
  }

  /* ------------------------------------------------------------ shortcuts */

  function setUpShortcuts() {
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closeMenus();
        dotMap.setArmed(false);
        return;
      }
      var modifier = isApple ? event.metaKey : event.ctrlKey;
      if (!modifier || event.altKey) return;

      var key = event.key.toLowerCase();
      if (key === 's') { event.preventDefault(); saveFile(); }
      else if (key === 'o') { event.preventDefault(); openFile(); }
      else if (key === 'g') { event.preventDefault(); runAction('view-zoom'); }
      else if (key === 'f' && event.shiftKey) { event.preventDefault(); formatDocument(); }
    });

    global.addEventListener('beforeunload', function (event) {
      if (!isModified()) return;
      event.preventDefault();
      event.returnValue = '';
    });
  }

  /* ----------------------------------------------------------------- boot */

  function boot() {
    elements = {
      file: byId('status-file'),
      dots: byId('status-dots'),
      problems: byId('status-problems'),
      message: byId('status-message'),
      dot: byId('status-dot'),
      cursor: byId('status-cursor'),
      coordinate: byId('status-coordinate'),
      editorPane: byId('editor-pane'),
      fileInput: byId('file-input'),
      sheet: byId('sheet'),
      sheetTitle: byId('sheet-title'),
      sheetBody: byId('sheet-body')
    };

    editor = new global.DOTE.Editor({ textarea: byId('text') });

    dotMap = new global.DOTE.DotMap(byId('map'));

    editor.onChange = function () {
      debounce('parse', PARSE_DELAY, reparse);
      updateStatus();
    };

    editor.onCursor = function () {
      syncSelectionFromCursor();
    };

    // the pattern only ever matches http and https, so there is no scheme to
    // vet before handing the url to the browser
    editor.onLink = function (url) {
      global.open(url, '_blank', 'noopener,noreferrer');
      flash('opened ' + url);
    };

    dotMap.onSelect = function (index) { selectDot(index); };
    dotMap.onMove = function (index, longitude, latitude) { moveDot(index, longitude, latitude); };
    dotMap.onAdd = function (longitude, latitude) { addDot(longitude, latitude); };
    dotMap.onPointer = function (pointer) { showCoordinate(pointer); };
    dotMap.onView = function () {
      showCoordinate(null);
      debounce('hash', HASH_DELAY, writeHash);
    };

    global.addEventListener('hashchange', applyHash);

    elements.fileInput.addEventListener('change', function () {
      var file = elements.fileInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        setDocument(String(reader.result), file.name, null);
        flash('opened ' + file.name);
      };
      reader.readAsText(file);
      elements.fileInput.value = '';
    });

    elements.coordinate.addEventListener('click', function () {
      var text = elements.coordinate.textContent.split('  ')[0];
      if (!text || !global.navigator.clipboard) return;
      global.navigator.clipboard.writeText(text).then(function () {
        flash('copied ' + text);
      });
    });

    // dropping a .dot file anywhere opens it
    document.addEventListener('dragover', function (event) { event.preventDefault(); });
    document.addEventListener('drop', function (event) {
      event.preventDefault();
      var file = event.dataTransfer && event.dataTransfer.files[0];
      if (!file) return;
      file.text().then(function (text) {
        setDocument(text, file.name, null);
        flash('opened ' + file.name);
      });
    });

    setUpMenus();
    setUpShortcuts();

    var parameters = readParameters();
    state.writable = parameters.writable;

    // say up front that Save cannot write back, rather than letting it look
    // like it worked and leaving a copy in the downloads folder
    if (!canSaveInPlace && !state.writable) {
      document.querySelectorAll('[data-action="file-save"], [data-action="file-save-as"]')
        .forEach(function (button) {
          button.firstChild.nodeValue = button.firstChild.nodeValue.trim() + ' (downloads)';
        });
    }

    // a view in the url wins over fitting the map to the dots
    var view = readHash();

    // nothing is remembered between visits: either the url says what to open,
    // or the document starts empty
    if (parameters.url) {
      setDocument('', fileNameFor(parameters.url), null, true);
      loadFromUrl(parameters.url, !!view);
    } else {
      setDocument(TEMPLATE, 'untitled.dot', null, !!view);
    }

    if (view) dotMap.setView(view);
    else writeHash();
    showCoordinate(null);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(this);
</script>
</body>
</html>
